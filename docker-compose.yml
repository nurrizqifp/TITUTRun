services:
  database:
    image: ${POSTGRES_IMAGE:?Set POSTGRES_IMAGE in the root .env file}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in the root .env file}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in the root .env file}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
      POSTGRES_CONTAINER_PORT: ${POSTGRES_CONTAINER_PORT:?Set POSTGRES_CONTAINER_PORT in the root .env file}
    command: ["postgres", "-p", "${POSTGRES_CONTAINER_PORT:?Set POSTGRES_CONTAINER_PORT in the root .env file}"]
    volumes:
      - titut-run-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -p ${POSTGRES_CONTAINER_PORT:?Set POSTGRES_CONTAINER_PORT in the root .env file} -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      args:
        NODE_IMAGE: ${BACKEND_IMAGE:?Set BACKEND_IMAGE in the root .env file}
        PORT: ${BACKEND_CONTAINER_PORT:?Set BACKEND_CONTAINER_PORT in the root .env file}
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      PORT: ${BACKEND_CONTAINER_PORT:?Set BACKEND_CONTAINER_PORT in the root .env file}
      DATABASE_URL: postgres://${POSTGRES_USER:?Set POSTGRES_USER in the root .env file}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}@database:${POSTGRES_CONTAINER_PORT:?Set POSTGRES_CONTAINER_PORT in the root .env file}/${POSTGRES_DB:?Set POSTGRES_DB in the root .env file}
    ports:
      - "${BACKEND_HOST_PORT:?Set BACKEND_HOST_PORT in the root .env file}:${BACKEND_CONTAINER_PORT:?Set BACKEND_CONTAINER_PORT in the root .env file}"
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NODE_IMAGE: ${FRONTEND_BUILD_IMAGE:?Set FRONTEND_BUILD_IMAGE in the root .env file}
        NGINX_IMAGE: ${FRONTEND_IMAGE:?Set FRONTEND_IMAGE in the root .env file}
        VITE_API_URL: ${FRONTEND_API_URL:?Set FRONTEND_API_URL in the root .env file}
        FRONTEND_CONTAINER_PORT: ${FRONTEND_CONTAINER_PORT:?Set FRONTEND_CONTAINER_PORT in the root .env file}
    restart: unless-stopped
    environment:
      FRONTEND_CONTAINER_PORT: ${FRONTEND_CONTAINER_PORT:?Set FRONTEND_CONTAINER_PORT in the root .env file}
    ports:
      - "${FRONTEND_HOST_PORT:?Set FRONTEND_HOST_PORT in the root .env file}:${FRONTEND_CONTAINER_PORT:?Set FRONTEND_CONTAINER_PORT in the root .env file}"
    depends_on:
      - backend

volumes:
  titut-run-data:
